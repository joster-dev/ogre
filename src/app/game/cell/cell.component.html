<button
  type="button"
  [class.active]="isActive()"
  [class.accent]="(cell().x + cell().y) % 2 === 0"
  [class.pulse-sm]="!isDisabled()"
  [disabled]="isDisabled()"
  (click)="action.emit()"
>
  @if (cell().occupant; as occupant) {
    <div>
      @if (occupant.isMain === true) {
        <icon-stack title="Main Pawn">
          <icon
            type="ring"
            [fill]="occupant.side === 'a' ? '777CCC' : 'CCC777'"
          ></icon>
          <icon
            type="ogre"
            [fill]="occupant.side === 'a' ? '777CCC' : 'CCC777'"
          ></icon>
        </icon-stack>
      } @else {
        <icon
          type="ring"
          [fill]="occupant.side === 'a' ? '777CCC' : 'CCC777'"
          title="Pawn"
        ></icon>
      }
    </div>
  }
  @if (cell().victory; as victory) {
    <div class="watermark">
      <icon
        type="crown"
        [fill]="victory === 'a' ? '777CCC' : 'CCC777'"
      ></icon>
    </div>
  }
  @if (isTarget() === true) {
    <div class="target-bg"></div>
  }
</button>
