<button
  type="button"
  [class.active]="isActive()"
  [class.pulse-sm]="!isDisabled()"
  [disabled]="isDisabled()"
  (click)="action.emit()"
>
  @if (side(); as side) {
  <icon
    [type]="isMain() ? 'crown' : 'ring'"
    [fill]="side === 'a' ? ['current', null] : [null, 'current']"
    [title]="isMain() ? 'King' : 'Pawn'"
  ></icon>
  }
  @if (temple(); as temple) {
  <icon
    class="watermark"
    type="ogre"
    [fill]="temple === 'a' ? ['current', null] : [null, 'current']"
  ></icon>
  }
  @if (isTarget()) {
  <div class="target-bg"></div>
  }
</button>
