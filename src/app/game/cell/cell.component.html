<button
  type="button"
  [class.active]="isActive()"
  [class.accent]="isAccent()"
  [class.pulse-sm]="!isDisabled()"
  [disabled]="isDisabled()"
  (click)="action.emit()"
>
  @if (side(); as side) {
  <icon
    [type]="isMain() ? 'crown' : 'ring'"
    [fill]="fill[side]"
    title="Pawn"
  ></icon>
  }
  @if (temple(); as temple) {
  <div class="watermark">
    <icon
      type="ogre"
      [fill]="fill[temple]"
    ></icon>
  </div>
  }
  @if (isTarget()) {
  <div class="target-bg"></div>
  }
</button>
