@if (banner(); as banner) {
<div
  class="outcome"
  role="status"
>
  {{banner}}
</div>
}

<section id="game">
  <div class="a-cards">
    @for (entry of store.hands().a; track entry.index) {
    <ogre-card
      [card]="entry.card"
      side="a"
      [isActive]="entry.isActive"
      [isDisabled]="entry.isDisabled"
      [isPulse]="store.turn() === 'a' && !store.hasSelectedCard()"
      (action)="store.selectCard(entry.index)"
    ></ogre-card>
    }
    <div class="watermark">
      <icon
        type="user"
        size="5rem"
      ></icon>
    </div>
  </div>

  <div class="b-cards">
    @for (entry of store.hands().b; track entry.index) {
    <ogre-card
      [card]="entry.card"
      side="b"
      [isActive]="entry.isActive"
      [isDisabled]="entry.isDisabled"
      [isPulse]="store.turn() === 'b' && !store.hasSelectedCard()"
      (action)="store.selectCard(entry.index)"
    ></ogre-card>
    }
    <div class="watermark">
      <icon
        type="user"
        size="5rem"
      ></icon>
    </div>
  </div>

  <div class="spare-card">
    <ng-container *ngTemplateOutlet="arrow"></ng-container>
    <ogre-card
      [card]="store.spare()"
      [isDisabled]="true"
    ></ogre-card>
    <ng-container *ngTemplateOutlet="arrow"></ng-container>
  </div>
  <ng-template #arrow>
    <span
      class="arrow"
      title="{{store.spare().name}} goes {{store.turn() === 'a' ? 'Left' : 'Right'}}"
    >
      {{store.turn() === 'a' ? '👈' : '👉'}}
    </span>
  </ng-template>

  <div
    class="grid"
    [class.active]="store.hasSelectedCard()"
  >
    @for (cell of store.cells(); track $index) {
    <ogre-cell
      [side]="cell.side"
      [isMain]="cell.isMain"
      [temple]="cell.temple"
      [isAccent]="cell.isAccent"
      [isActive]="cell.isActive"
      [isDisabled]="cell.isDisabled"
      [isTarget]="cell.isTarget"
      [style.grid-column]="cell.column"
      [style.grid-row]="cell.row"
      (action)="store.selectCell(cell.index)"
    ></ogre-cell>
    }
  </div>
</section>

<footer>
  <ogre-form (restart)="store.newGame()"></ogre-form>
</footer>
