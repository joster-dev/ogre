<section id="game">
  <div
    class="a-cards"
    [class.pulse]="game().turn === 'a' && selectedCard() === undefined"
  >
    @for (card of aCards; track card) {
      <ogre-card
        [card]="card"
        [isActive]="selectedCard() === card"
        [isDisabled]="game().turn === 'b'"
        (action)="selectCard(card)"
      ></ogre-card>
    }
    <div class="watermark">
      <icon
        type="user"
        size="5rem"
      ></icon>
    </div>
  </div>

  <div
    class="b-cards"
    [class.pulse]="game().turn === 'b' && selectedCard() === undefined"
  >
    @for (card of bCards; track card) {
      <ogre-card
        [card]="card"
        [isActive]="selectedCard() === card"
        [isDisabled]="game().turn === 'a'"
        (action)="selectCard(card)"
      ></ogre-card>
    }
    <div class="watermark">
      <icon
        type="user"
        size="5rem"
      ></icon>
    </div>
  </div>

  <div class="spare-card">
    <ng-container *ngTemplateOutlet="arrow"></ng-container>
    @if (spareCard; as card) {
      <ogre-card
        [card]="card"
        [isDisabled]="true"
      ></ogre-card>
    }
    <ng-container *ngTemplateOutlet="arrow"></ng-container>
  </div>
  <ng-template #arrow>
    <span
      class="arrow"
      title="{{spareCard?.name}} goes {{game().turn === 'a' ? 'Left' : 'Right'}}"
    >
      {{game().turn === 'a' ? '👈' : '👉'}}
    </span>
  </ng-template>

  <div
    class="grid"
    [class.active]="selectedCard() !== undefined"
  >
    @for (cell of game().cells; track cell) {
      <ogre-cell
        [cell]="cell"
        [isActive]="cell === selectedCell()"
        [isDisabled]="isCellDisabled(cell)"
        [isTarget]="targetCells.includes(cell) === true"
        [style.grid-column]="cell.x + 1"
        [style.grid-row]="cell.y + 1"
        (action)="selectCell(cell)"
      ></ogre-cell>
    }
  </div>
</section>

<footer>
  <ogre-form
    [model]="form"
    (restart)="newGame()"
  ></ogre-form>
</footer>
