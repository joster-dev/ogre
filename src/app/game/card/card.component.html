<button
  type="button"
  [class.is-active]="isActive()"
  [class.rotate-90]="side() === 'a'"
  [class.rotate-270]="side() === 'b'"
  [class.pulse]="isPulse()"
  [disabled]="isDisabled()"
  [title]="card().name"
  (click)="action.emit()"
>
  <div class="grid">
    @for (square of squares(); track $index) {
    <div
      class="cell"
      [class.accent]="(square.x + square.y) % 2 === 0"
      [class.center]="square.isCenter"
      [style.grid-column]="square.x + 1"
      [style.grid-row]="square.y + 1"
    >
      @if (square.isActive) {
      <div class="target-bg"></div>
      }
    </div>
    }
  </div>
  <div
    class="icon"
    [class.rotate-90]="side() === 'b'"
    [class.rotate-270]="side() === 'a'"
  >
    {{card().icon}}
  </div>
</button>
