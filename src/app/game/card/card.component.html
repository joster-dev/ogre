<button
  type="button"
  [class.isDeck]="isDeck()"
  [class.is-active]="isActive()"
  [class.pulse]="isPulse()"
  [class.side-a]="side() === 'a'"
  [class.side-b]="side() === 'b'"
  [disabled]="isDisabled()"
  [title]="card().name"
  (click)="action.emit()"
>
  <div class="grid">
    @for (square of squares(); track $index) {
    <div
      class="cell"
      [style.grid-column]="square.x + 1"
      [style.grid-row]="square.y + 1"
    >
      @if (square.isCenter) {
      <icon
        type="ring"
        class="rotate-270"
        [fill]="['current', null]"
      ></icon>
      }
      @if (square.isActive) {
      <div class="target-bg"></div>
      }
    </div>
    }
  </div>
  <div class="icon">
    {{card().icon}}
  </div>
</button>
