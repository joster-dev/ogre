@for (card of model(); track card) {
  <div>
    <cc-choice
      [ngModel]="card.isActive"
      (ngModelChange)="changeCard(card, $event)"
      [items]="includedItems"
      [disabled]="countActiveCards <= 5 && card.isActive === true"
    ></cc-choice>
    <ogre-card
      [card]="card"
      [isDisabled]="true"
    ></ogre-card>
  </div>
}
