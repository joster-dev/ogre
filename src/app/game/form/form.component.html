<form
  novalidate
  class="d-flex gap-3 flex-column"
>
  <div class="d-flex justify-content-center">
    <button
      type="button"
      class="new-game"
      (click)="requestRestart()"
    >
      New Game
    </button>
  </div>
  <div class="card">
    <div class="card-header">
      <h2 class="d-flex gap-2 align-items-center justify-content-between">
        <span>Bot Settings</span>
        <span>🤖</span>
      </h2>
    </div>
    <div class="card-body col-2">
      <cc-choice
        [ngModel]="settings.botEnabled()"
        (ngModelChange)="settings.botEnabled.set($event); requestRestart()"
        name="botEnabled"
        [items]="enabledItems"
      >
        Enabled
      </cc-choice>
      <cc-choice
        [ngModel]="settings.botFirst()"
        (ngModelChange)="settings.botFirst.set($event); requestRestart()"
        name="botFirst"
        [disabled]="!settings.botEnabled()"
        [items]="priorityItems"
      >
        Priority
      </cc-choice>
    </div>
  </div>
  <div class="card">
    <div class="card-header">
      <h2 class="d-flex gap-2 align-items-center justify-content-between">
        <span>Deck Settings</span>
        <span>🎴</span>
      </h2>
    </div>
    <div class="card-body">
      <ogre-deck (changeCardIsActive)="requestRestart()"></ogre-deck>
    </div>
  </div>
  <fieldset id="deck-fieldset">

  </fieldset>
  <fieldset>
    <h3>🤵 User Settings</h3>
  </fieldset>
</form>
