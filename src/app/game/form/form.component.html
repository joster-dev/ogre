@let form = model();

<div>
  <button
    type="button"
    (click)="requestRestart()"
  >
    Restart
  </button>
</div>
<form>
  <fieldset>
    <h3>🤖 Bot Settings</h3>
    <div id="bot">
      <cc-choice
        [(ngModel)]="form.isBotEnabled"
        name="isBotEnabled"
        [items]="enabledItems"
        (ngModelChange)="requestRestart()"
      >
        Enabled
      </cc-choice>
      <cc-choice
        [(ngModel)]="form.isBotFirst"
        name="isBotFirst"
        [disabled]="!form.isBotEnabled"
        [items]="priorityItems"
        (ngModelChange)="requestRestart()"
      >
        Priority
      </cc-choice>
    </div>
  </fieldset>
  <fieldset id="deck-fieldset">
    <h3>🎴 Deck Settings</h3>
    <ogre-deck
      [model]="form.deck"
      (changeCardIsActive)="requestRestart()"
    ></ogre-deck>
  </fieldset>
  <fieldset>
    <h3>🤵 User Settings</h3>
  </fieldset>
</form>
